<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#9bbbd4">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>미유 갸루톡</title>
</head>
<body>
<div id="app">
  <!-- 채팅 화면 -->
  <section id="chatView" class="view">
    <header class="topbar">
      <div class="who"><div class="avatar">💖</div><div><b>미유 (みゆ)</b><small id="status">갸루 스타일 전문가 · 17세</small></div></div>
      <div class="actions">
        <button id="recsBtn" title="추천함" aria-label="추천함">⭐</button>
        <button id="settingsBtn" title="설정" aria-label="설정">⚙️</button>
      </div>
    </header>
    <main id="messages" aria-live="polite"></main>
    <div id="quick" class="quick"></div>
    <div id="preview" class="preview hidden"></div>
    <footer class="composer">
      <button id="attachBtn" class="icon-btn" aria-label="사진 첨부">＋</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="메시지 입력" enterkeyhint="send"></textarea>
      <button id="sendBtn" class="send" disabled>전송</button>
    </footer>
  </section>

  <!-- 추천함 -->
  <section id="recsView" class="view hidden">
    <header class="topbar"><button id="recsBack" class="back" aria-label="뒤로">‹</button><b>내 추천함</b><span></span></header>
    <div id="recsList" class="recs-list"></div>
  </section>

  <!-- 설정 시트 -->
  <div id="sheetBg" class="sheet-bg hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-label="설정">
    <div class="grab"></div>
    <h3>설정</h3>
    <label class="field-label">Groq API 키</label>
    <div id="keyState" class="key-state"></div>
    <div class="key-row">
      <input id="keyInput" type="password" placeholder="gsk_..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="keySave" class="btn yellow">저장</button>
    </div>
    <p class="hint">🔒 키는 내 서버에 암호화되어 저장되고, 브라우저 코드·저장소에는 남지 않아요. 저장 후엔 화면에서도 다시 보이지 않아요.
      <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">키 발급받기</a></p>
    <label class="field-label">모델 (사진 분석은 비전 모델 필요)</label>
    <select id="modelSel"></select>
    <div class="sheet-btns">
      <button id="keyDelete" class="btn danger">키 삭제</button>
      <button id="clearChat" class="btn">대화 기록 삭제</button>
      <button id="sheetClose" class="btn yellow">닫기</button>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden"><img alt=""></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
